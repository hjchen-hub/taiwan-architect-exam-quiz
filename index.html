<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>建築師高考考古題練習</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5ef;color:#203431;font:16px system-ui,"Noto Sans TC",sans-serif}.w{max-width:760px;margin:auto;padding:20px 16px}h1{color:#173c37;font-size:clamp(28px,7vw,40px)}.c{background:white;border:1px solid #dfe6df;border-radius:17px;padding:17px;margin:14px 0}select,button{font:inherit;padding:11px;border:1px solid #dfe6df;border-radius:10px;background:white;color:#173c37}button{cursor:pointer;font-weight:650}.p{background:#173c37;color:white}.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1}.clock{font-size:32px;font-weight:bold;color:#173c37}.q{font-size:20px;line-height:1.6;font-weight:bold}.opt{display:flex;width:100%;text-align:left;margin:8px 0;gap:10px}.ok{background:#e8f4e9}.bad{background:#fff0ed}.foot{font-size:12px;line-height:1.8;color:#687b76}@media(max-width:500px){.q{font-size:18px}}</style><main class=w><b>築匠・考試練習</b><h1>建築師高考考古題</h1><p>單題作答，答錯立即顯示正解。</p><section class=c><div class=row><select id=s><option value=all>全部科目</option><option>營建法規與實務</option><option>建築環境控制</option></select><select id=y><option value=all>近兩年（113–114）</option><option>113</option><option>114</option></select></div><p>考試倒數　<div id=t class=clock>02:00:00</div><span id=status>尚未開始</span></p><div class=row><button class=p id=start>開始</button><button id=pause>暫停</button><button id=reset>重來</button><button id=refresh>更新試題</button></div></section><section class=c><small id=meta></small><p id=q class=q></p><div id=opts></div><div id=fb></div><p class=row><button id=prev>上一題</button><span id=count></span><button id=next class=p>下一題</button></p></section><section class="c foot">互動區先收錄已核對選擇題樣題。建築計畫設計、敷地計畫為申論／設計題，不適用單選判分；環境控制、建築結構也含申論題。完整試題和答案：<a href="https://wwwq.moex.gov.tw/exam/wFrmExamQandASearch.aspx?e=114180&y=2025">考選部114年</a>｜<a href="https://wwwq.moex.gov.tw/exam/wFrmExamQandASearch.aspx?e=113190&y=2024">考選部113年</a>。優先採更正答案。</section></main><script>
const B=[
['113','營建法規與實務','建築法規定，申請建造執照建築物平面、立面、剖面圖比例尺最小不得小於多少？',['1/30','1/50','1/100','1/200'],3,'官方更正答案：D'],
['113','營建法規與實務','主管機關收到建照申請書件之日起，至多幾日內審查完竣？',['5日','10日','15日','30日'],1,'更正公告另記第2題答D給分，請查閱官方公告'],
['113','建築環境控制','無障礙昇降機出入口與機廂地板水平間隙，最小不得大於幾公分？',['3.2','4.2','4.7','5.2'],0,'公開試題答案A'],
['113','建築環境控制','無設備時，適合臺灣平地氣候的策略：①高氣密②深遮陽③良好通風④良好隔熱',['僅①②③','僅①③④','僅②③④','①②③④'],2,'公開試題答案C'],
['114','營建法規與實務','依建築法，下列敘述何者錯誤？',['建築基地含建物所占地面及法定空地','法定空地非依規定不得移轉','法定空地留設包括建物與道路或其他建物間距','法定空地分割辦法由地方主管機關定之'],3,'題目按114年公開試題整理，核對官方答案'],
['114','營建法規與實務','依建築法，建築物修建應請領何種執照？',['修建執照','建造執照','雜項執照','整建執照'],0,'依114年公開試題整理'],
['114','建築環境控制','熱舒適 PMV-PPD 評價法，下列何者錯誤？',['感知由皮膚溫度及汗水產生率決定','熱舒適是主觀感知','PMV與身體熱應力成正比','衣著太厚時PMV公式不準確'],2,'依114年公開試題整理，請核對官方答案'],
['114','建築環境控制','哪項措施無法防止冬季壁體表面結露？',['增加室內水蒸氣','增加隔熱避免表面降溫','使用除濕機','促進通風'],0,'依114年公開試題整理']
];let A=[],i=0,n=7200,tm=null,ans={};const $=x=>document.getElementById(x),L='ＡＢＣＤ';function filt(){return B.filter(x=>($('y').value==='all'||x[0]===$('y').value)&&($('s').value==='all'||x[1]===$('s').value))}function fmt(n){return[Math.floor(n/3600),Math.floor(n%3600/60),n%60].map(v=>('0'+v).slice(-2)).join(':')}function draw(){if(!A.length)A=filt();i=Math.max(0,Math.min(A.length-1,i));let x=A[i];if(!x)return;$('meta').textContent=x[0]+'年｜'+x[1]+'｜選擇題';$('q').textContent=x[2];$('count').textContent=(i+1)+' / '+A.length;$('opts').replaceChildren();$('fb').replaceChildren();x[3].forEach((v,k)=>{let b=document.createElement('button');b.className='opt';b.textContent=L[k]+'　'+v;if(ans[i]!==undefined){if(k===x[4])b.classList.add('ok');if(k===ans[i]&&k!==x[4])b.classList.add('bad')}b.onclick=()=>{if(ans[i]===undefined){ans[i]=k;draw()}};$('opts').append(b)});if(ans[i]!==undefined){let f=$('fb'),ok=ans[i]===x[4];f.className='c '+(ok?'ok':'bad');f.textContent=(ok?'答對！':'答錯，正確答案：'+L[x[4]]+' '+x[3][x[4]]+'。')+' '+x[5]}$('prev').disabled=i===0;$('next').disabled=i===A.length-1}function reset(){clearInterval(tm);tm=null;n=7200;ans={};i=0;$('t').textContent=fmt(n);$('status').textContent='尚未開始';draw()}$('start').onclick=()=>{if(tm)return;$('status').textContent='測驗中';tm=setInterval(()=>{n--;$('t').textContent=fmt(n);if(n<=0){clearInterval(tm);tm=null;$('status').textContent='時間到'}},1000)};$('pause').onclick=()=>{clearInterval(tm);tm=null;$('status').textContent='已暫停'};$('reset').onclick=reset;$('refresh').onclick=()=>{A=filt().sort(()=>Math.random()-.5);i=0;ans={};draw()};$('prev').onclick=()=>{i--;draw()};$('next').onclick=()=>{i++;draw()};$('y').onchange=()=>{A=filt();reset()};$('s').onchange=()=>{$('y').dispatchEvent(new Event('change'))};draw();
</script></html>
